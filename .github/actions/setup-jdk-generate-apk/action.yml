name: 'Setup JDK + Gradle + Generate APK'
description: 'Setup JDK, Gradle, and generate an Android APK'
inputs:
  APP_ENV:
    description: 'APP_ENV (one of): development, staging, production'
    required: true
    default: 'staging'
  BUILD_TYPE:
    description: 'Gradle build type: debug or release'
    required: false
    default: 'release'

runs:
  using: 'composite'
  steps:
    - name: Set Up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Generate APK
      working-directory: android
      run: |
        chmod +x ./gradlew
        ./gradlew assemble${{ inputs.BUILD_TYPE }} --no-daemon
      shell: bash
      env:
        EXPO_NO_DOTENV: 1
        APP_ENV: ${{ inputs.APP_ENV }}
        CI: true
